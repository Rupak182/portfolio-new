<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <defs>
    <style>
      /* Light Mode Styles (default) */
      .client-box { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 2; }
      .client-text { fill: #374151; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: bold; }
      
      .interface-box { fill: #d3daea; stroke: #0274a7; stroke-width: 2; }
      .interface-text { fill: #12222c; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: bold; }
      
      .impl-box { fill: #d2cff8; stroke: #626bc8; stroke-width: 2; }
      .impl-text { fill: #1f263a; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: bold; }
      .impl-subtext { fill: #1f263a; font-family: 'Inter', sans-serif; font-size: 11px; }
      
      .line { stroke: #1e1e1e; stroke-width: 2; fill: none; }
      .line-dashed { stroke: #1e1e1e; stroke-width: 2; stroke-dasharray: 6,4; fill: none; }
      .arrow-solid { fill: #1e1e1e; }
      .arrow-hollow { fill: #ffffff; stroke: #1e1e1e; stroke-width: 2; }
      
      .label-text { fill: #555555; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: bold; }
      .title-text { fill: #111111; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: bold; text-decoration: underline; }
      
      /* Dark Mode Overrides */
      @media (prefers-color-scheme: dark) {
        .client-box { fill: #1f2937 !important; stroke: #4b5563 !important; }
        .client-text { fill: #d1d5db !important; }
        
        .interface-box { fill: #0f172a !important; stroke: #38bdf8 !important; }
        .interface-text { fill: #e0f2fe !important; }
        
        .impl-box { fill: #1e1b4b !important; stroke: #818cf8 !important; }
        .impl-text { fill: #e0e7ff !important; }
        .impl-subtext { fill: #a5b4fc !important; }
        
        .line { stroke: #94a3b8 !important; }
        .line-dashed { stroke: #94a3b8 !important; }
        .arrow-solid { fill: #94a3b8 !important; }
        .arrow-hollow { fill: #0f172a !important; stroke: #38bdf8 !important; }
        
        .label-text { fill: #94a3b8 !important; }
        .title-text { fill: #f8fafc !important; }
      }
    </style>
  </defs>

  <!-- Left Column: Simple Interface / What to do -->
  <text x="150" y="25" text-anchor="middle" class="title-text">WHAT TO DO</text>

  <!-- Client Box -->
  <rect x="20" y="90" width="110" height="60" rx="8" ry="8" class="client-box" />
  <text x="75" y="125" text-anchor="middle" class="client-text">Client Code</text>

  <!-- Interface (Abstraction Layer) -->
  <rect x="175" y="85" width="110" height="70" rx="6" ry="6" class="interface-box" />
  <text x="230" y="112" text-anchor="middle" class="interface-text">&lt;&lt;interface&gt;&gt;</text>
  <text x="230" y="132" text-anchor="middle" class="interface-text">UserStorage</text>

  <!-- Client dependency on Interface -->
  <line x1="130" y1="120" x2="165" y2="120" class="line" />
  <polygon points="175,120 165,115 165,125" class="arrow-solid" />
  <text x="152" y="110" text-anchor="middle" class="label-text">uses</text>


  <!-- Right Column: Complex Implementation / How it is done -->
  <text x="400" y="25" text-anchor="middle" class="title-text">HOW IT IS DONE (HIDDEN)</text>

  <!-- Concrete Impl Box -->
  <rect x="320" y="70" width="160" height="100" rx="8" ry="8" class="impl-box" />
  <text x="400" y="92" text-anchor="middle" class="impl-text">SqlUserStorage</text>
  <text x="335" y="118" class="impl-subtext">- DB Connection Pool</text>
  <text x="335" y="136" class="impl-subtext">- SQL Queries (INSERT)</text>
  <text x="335" y="154" class="impl-subtext">- Transaction Management</text>

  <!-- Realization arrow (Dashed, hollow triangle pointing left to the Interface) -->
  <line x1="320" y1="120" x2="295" y2="120" class="line-dashed" />
  <polygon points="285,120 297,114 297,126" class="arrow-hollow" />
</svg>
